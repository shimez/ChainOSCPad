name: Build and draft release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }} firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: xiao_esp32s3
            label: XIAO ESP32S3
            slug: XIAO-ESP32S3
            chip: esp32s3
            flash_size: 8MB
          - environment: xiao_esp32c3
            label: XIAO ESP32C3
            slug: XIAO-ESP32C3
            chip: esp32c3
            flash_size: 4MB
          - environment: xiao_esp32c5
            label: XIAO ESP32C5
            slug: XIAO-ESP32C5
            chip: esp32c5
            flash_size: 8MB
          - environment: xiao_esp32c6
            label: XIAO ESP32C6
            slug: XIAO-ESP32C6
            chip: esp32c6
            flash_size: 4MB
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-release.txt

      - name: Install PlatformIO
        run: python -m pip install --requirement .github/requirements-release.txt

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python scripts/check_release_version.py
          --tag "$RELEASE_TAG"
          --check-installer-metadata
          --github-output "$GITHUB_OUTPUT"

      - name: Build with PlatformIO
        run: platformio run -e "${{ matrix.environment }}"

      - name: Create merged firmware
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          firmware="ChainOSCPad-${VERSION}-${{ matrix.slug }}-merged.bin"
          esptool="$(find "$HOME/.platformio" -path '*/tool-esptoolpy/esptool.py' -print -quit)"
          boot_app="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "$esptool"
          test -n "$boot_app"
          mkdir -p dist
          python "$esptool" \
            --chip "${{ matrix.chip }}" merge_bin \
            -o "dist/$firmware" \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size "${{ matrix.flash_size }}" \
            0x0 ".pio/build/${{ matrix.environment }}/bootloader.bin" \
            0x8000 ".pio/build/${{ matrix.environment }}/partitions.bin" \
            0xe000 "$boot_app" \
            0x10000 ".pio/build/${{ matrix.environment }}/firmware.bin"
          sha256sum "dist/$firmware" > "dist/ChainOSCPad-${VERSION}-${{ matrix.slug }}-SHA256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChainOSCPad-${{ steps.version.outputs.version }}-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload release files for draft job
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-files-${{ matrix.environment }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  draft-release:
    name: Create draft GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-files-*
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: ChainOSCPad ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --generate-notes
          --title "$RELEASE_TITLE"
