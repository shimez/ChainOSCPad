[platformio]
default_envs =
  xiao_esp32s3
  xiao_esp32c6

[env]
framework = arduino
monitor_speed = 115200

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DCHAINOSCPAD_PLATFORMIO

lib_deps =
  hideakitai/ArduinoOSC@0.6.0
  bblanchon/ArduinoJson@^7.4.2

monitor_filters =
  esp32_exception_decoder
  time

[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
build_flags =
  ${env.build_flags}
  -DCHAINOSCPAD_BOARD_XIAO_ESP32S3

[env:xiao_esp32c6]
platform = https://github.com/Seeed-Studio/platform-seeedboards/archive/6e8494feaec5fa45882e8cf2f33d1e3f25fa709f.zip
board = seeed-xiao-esp32-c6
build_flags =
  ${env.build_flags}
  -DCHAINOSCPAD_BOARD_XIAO_ESP32C6
